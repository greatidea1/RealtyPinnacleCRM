# Dokploy Compose: app + Postgres on the same stack / network.
# 1. Create a Docker Compose service → select this repo / docker-compose.yml
# 2. Set env: POSTGRES_PASSWORD (required), optional POSTGRES_USER / POSTGRES_DB
# 3. Domains → service "app", container port 3000, HTTPS + Let's Encrypt
# 4. Deploy on your remote server (m1) so DNS points at that server's IP
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Do not publish host ports — Dokploy/Traefik routes via Domains (port 3000).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-realtypinnacle}?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-realtypinnacle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Postgres stays internal to the compose network (no expose/ports).

volumes:
  postgres_data:
# End docker-compose.yml
