# Dokploy Compose: app + Postgres on the same stack / network.
# 1. Create a Docker Compose service → this repo / docker-compose.yml
# 2. Env: POSTGRES_PASSWORD (required); optional POSTGRES_USER / POSTGRES_DB
# 3. Domains tab → Service: app · Port: 3000 · Host: crm.realtypinnacle.com
# 4. Redeploy after adding the domain (so Traefik labels + network attach)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Traefik routes via Domains — do not publish host ports.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-realtypinnacle}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-realtypinnacle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

volumes:
  postgres_data:

networks:
  # Lets Traefik on the remote server reach the app after you add a Domain.
  dokploy-network:
    external: true
# End docker-compose.yml
