# Dokploy Compose (Ampere / arm64): pull prebuilt app from GHCR + Postgres.
# App image is built by GitHub Actions as linux/arm64 — never build on this VPS.
#
# GHCR + Dokploy one-time setup:
#   1. Push to main (or run workflow_dispatch) → Actions "Docker publish" must be green.
#   2. GitHub → Packages → realtypinnaclecrm → confirm linux/arm64 exists for :main.
#   3. Create a classic PAT: https://github.com/settings/tokens
#        scopes: read:packages (add repo if the package is linked to a private repo).
#   4. Dokploy → Registry: host=ghcr.io, username=<GitHub user>, password=<PAT>.
#   5. Compose service uses image: below with NO build: block; redeploy = pull + recreate.
#   6. If "manifests/main: denied": PAT/registry missing or wrong; fix step 3–4, retry.
#   7. If "no matching manifest for linux/arm64|amd64": wait for multi-arch CI (:main has both).
#   8. In Dokploy app General, set Server = Ampere (pull arch must match that host).
#
# Environment tab must include:
#   POSTGRES_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD, SESSION_SECRET
# optional: POSTGRES_USER, POSTGRES_DB, ADMIN_NAME, APP_URL
services:
  app:
    image: ghcr.io/greatidea1/realtypinnaclecrm:main
    # Dokploy compose uses `up --build` without --pull; without this, an old
    # local :main image is reused forever (e.g. still shows: prisma: not found).
    pull_policy: always
    restart: unless-stopped
    # Traefik routes via Domains — do not publish host ports.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-realtypinnacle}?schema=public
      # Pass-through from Dokploy Environment (do NOT use ${VAR:-} empty defaults — they wipe injected values).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-realtypinnacle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
# End docker-compose.yml
