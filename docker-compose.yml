# Dokploy Compose — pull prebuilt image from GHCR (built by GitHub Actions).
# Do NOT build on the VPS (slow / OOM on small Ampere boxes).
#
# Image is published by .github/workflows/docker-publish.yml on every push to main.
# Package should be Public so Dokploy can pull without registry credentials:
#   GitHub → Packages → realtypinnaclecrm → Package settings → Public
#
# Environment tab must include:
#   POSTGRES_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD
# recommended: SESSION_SECRET, APP_URL=https://crm.realtypinnacle.com
# optional: POSTGRES_USER, POSTGRES_DB, ADMIN_NAME
services:
  app:
    image: ghcr.io/greatidea1/realtypinnaclecrm:main
    # Always pull the latest :main from GHCR after Actions finishes.
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-realtypinnacle}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_URL: ${APP_URL:-https://crm.realtypinnacle.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-realtypinnacle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
# End docker-compose.yml
