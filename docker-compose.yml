# Dokploy Compose — builds the app from this repo (GitHub source).
# Does NOT pull from GHCR (avoids: manifests/main: denied).
#
# Dokploy command is typically:
#   docker compose ... up -d --build --remove-orphans
# so `build:` + pull_policy: build is required.
#
# Environment tab must include:
#   POSTGRES_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD
# recommended: SESSION_SECRET, APP_URL=https://crm.realtypinnacle.com
# optional: POSTGRES_USER, POSTGRES_DB, ADMIN_NAME
#
# First deploy after this change can take several minutes (Next.js build on the VPS).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Local tag only — do not use ghcr.io here or compose will try to pull it.
    image: realty-pinnacle-app:local
    # never = do not hit a registry (Dokploy still passes --build).
    pull_policy: never
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-realtypinnacle}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_URL: ${APP_URL:-https://crm.realtypinnacle.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-realtypinnacle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
# End docker-compose.yml
