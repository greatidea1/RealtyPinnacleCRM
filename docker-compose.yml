# Dokploy Compose: app + Postgres on the same stack / network.
# Environment tab must include:
#   POSTGRES_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD
# optional: POSTGRES_USER, POSTGRES_DB, ADMIN_NAME
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Traefik routes via Domains — do not publish host ports.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-realtypinnacle}?schema=public
      # Pass-through from Dokploy Environment (do NOT use ${VAR:-} empty defaults — they wipe injected values).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - default

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      POSTGRES_DB: ${POSTGRES_DB:-realtypinnacle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

volumes:
  postgres_data:

networks:
  dokploy-network:
    external: true
# End docker-compose.yml
