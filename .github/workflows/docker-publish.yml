# Build Next.js image for amd64 + arm64 and publish a multi-arch manifest to GHCR.
# Ampere needs linux/arm64; Dokploy's control plane is often linux/amd64.
# Dokploy pulls this image — never build on the VPS.
#
# CRITICAL: Package must be Public so Dokploy can pull without registry credentials.
#   One-time: GitHub → Packages → realtypinnaclecrm → Package settings → Public
name: Docker publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase; keep in sync with docker-compose.yml image:
  IMAGE_NAME: greatidea1/realtypinnaclecrm
  PACKAGE_NAME: realtypinnaclecrm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform pair name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Push by digest only; merge job attaches :main and short-sha tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=,format=short

      - name: Create multi-arch manifest and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

      - name: Make package public (required for Dokploy pull without registry login)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer PAT with package admin if provided; else GITHUB_TOKEN.
          TOKEN="${{ secrets.GHCR_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="$GH_TOKEN"; fi
          OWNER="${{ github.repository_owner }}"
          PKG="${{ env.PACKAGE_NAME }}"
          echo "Setting visibility=public for container package ${PKG}…"
          curl -sS -o /tmp/vis.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PKG}/visibility" \
            -d '{"visibility":"public"}' | tee /tmp/vis.code
          echo
          cat /tmp/vis.json || true
          curl -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${OWNER}/packages/container/${PKG}/visibility" \
            -d '{"visibility":"public"}' || true

      - name: Verify anonymous GHCR pull (Dokploy check)
        run: |
          # GHCR always returns 401 without a Bearer token — even for public packages.
          # Docker/Dokploy get an anonymous pull token first; mimic that flow here.
          IMAGE="${{ env.IMAGE_NAME }}"
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"
          TOKEN=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE}:pull" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain anonymous GHCR pull token for ${IMAGE}."
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: ${ACCEPT}" \
            "https://ghcr.io/v2/${IMAGE}/manifests/main")
          echo "Anonymous (token) GET status for :main => ${CODE}"
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::GHCR package is still PRIVATE. Dokploy will fail with 'denied'."
            echo "::error::Fix once: GitHub → Packages → ${{ env.PACKAGE_NAME }} → Package settings → Change visibility → Public"
            echo "::error::Then re-run this workflow (or Redeploy Dokploy after visibility is Public)."
            exit 1
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::Unexpected GHCR status ${CODE} for ${IMAGE}:main (expected 200)."
            exit 1
          fi
          echo "OK — anonymous access works (status ${CODE}). Dokploy can pull without a registry login."
# End docker-publish.yml
